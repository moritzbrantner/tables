name: Apply accessible grid keyboard model

on:
  push:
    branches:
      - feat/accessible-grid-keyboard

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accessible-grid-keyboard
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply keyboard model
        run: python scripts/apply-grid-keyboard.py
      - name: Verify keyboard model
        run: |
          bun install --frozen-lockfile
          bun run check-types
          bun run test
          bun run build
      - name: Commit keyboard model
        run: |
          rm -f scripts/apply-grid-keyboard.py .github/workflows/apply-grid-keyboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add accessible virtual-grid keyboard navigation"
          git push origin HEAD:feat/accessible-grid-keyboard
