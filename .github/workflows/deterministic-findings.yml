name: Deterministic Findings

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings:
    name: Deterministic Findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Inspect deterministic findings
        uses: moritzbrantner/coding-tooling@81da4fbbdbe75a8937716cbab0b9a47c447269e8
        with:
          operation: findings
          bun-version: 1.3.14
          install-mode: none
          report-path: .artifacts/coding-tooling/findings.json

      - name: Upload findings evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deterministic-findings-${{ github.sha }}
          path: .artifacts/coding-tooling/findings.json
          if-no-files-found: error
          retention-days: 7
