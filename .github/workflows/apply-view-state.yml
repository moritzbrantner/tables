name: Apply durable table view state

on:
  push:
    branches:
      - feat/table-view-state-codec

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/table-view-state-codec
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Finalize documentation
        run: python scripts/finalize-view-state.py
      - name: Verify view-state contract
        run: |
          bun install --frozen-lockfile
          bun run check-types
          bun run test
          bun run build
          bunx publint --pack bun --strict
      - name: Commit verified view state
        run: |
          rm -f scripts/finalize-view-state.py .github/workflows/apply-view-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add durable table view-state codec"
          git push origin HEAD:feat/table-view-state-codec
