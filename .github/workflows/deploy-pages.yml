name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "scripts/smoke-pages.mjs"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "benchmarks/**"
      - "examples/**"
      - "src/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser Wasm build tools
        run: |
          rustup toolchain install
          if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Build production site from source
        run: |
          bun run build:wasm
          bun run build:examples:pages

      - name: Build isolated browser reference page
        run: |
          npm ci --prefix benchmarks/browser --ignore-scripts --no-audit --no-fund
          bun run build:references
          cp -a dist-browser-references dist-examples/references

      - name: Capture Pages query benchmark
        run: bun run benchmark:query -- --output dist-examples/benchmarks/query.json

      - name: Check deployed-layout browser behavior
        run: |
          bunx playwright install --with-deps chromium
          node scripts/smoke-pages.mjs

      - name: Verify browser reference adapters and performance work limits
        if: success() || failure()
        env:
          TABLES_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_PERFORMANCE: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'performance') }}
        run: |
          if [ "$FULL_PERFORMANCE" = true ]; then
            node --test benchmarks/browser/contract.test.mjs
            node benchmarks/browser/run.mjs --root dist-examples/references
          else
            node --test benchmarks/browser/contract.test.mjs
            node benchmarks/browser/run.mjs --root dist-examples/references --smoke
          fi

      - name: Retain reproducible browser evidence
        if: always()
        run: |
          mkdir -p .artifacts
          git rev-parse HEAD > .artifacts/pages-source-sha.txt

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-evidence-${{ github.sha }}
          path: |
            .artifacts/pages-smoke.png
            .artifacts/windowed-queries.png
            .artifacts/browser-references.png
            .artifacts/table-browser-reference-benchmark.json
            .artifacts/pages-source-sha.txt
            .artifacts/pages-final-state.png
            .artifacts/browser-reference-dom.html
            .artifacts/browser-reference-layout.json
            dist-examples
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-examples

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
