name: Rust Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/rust-foundation.md"
      - "package.json"
      - "scripts/benchmark-virtualization.ts"
      - "scripts/check-wasm-package.mjs"
      - "scripts/copy-wasm.mjs"
      - "src/data*.ts"
      - "src/query-kernel.ts"
      - "src/react*.tsx"
      - "src/virtualization.ts"
      - "src/virtualization.test.ts"
      - "src/wasm*.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/rust-foundation.md"
      - "package.json"
      - "scripts/benchmark-virtualization.ts"
      - "scripts/check-wasm-package.mjs"
      - "scripts/copy-wasm.mjs"
      - "src/data*.ts"
      - "src/query-kernel.ts"
      - "src/react*.tsx"
      - "src/virtualization.ts"
      - "src/virtualization.test.ts"
      - "src/wasm*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Compile benchmark targets
        run: cargo bench --locked --workspace --no-run

  wasm:
    name: Wasm parity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Verify adapter lockfile
        run: cargo metadata --locked --manifest-path crates/tables-wasm/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Check adapter formatting
        run: cargo fmt --manifest-path crates/tables-wasm/Cargo.toml -- --check

      - name: Lint adapter
        run: cargo clippy --locked --manifest-path crates/tables-wasm/Cargo.toml --all-targets -- -D warnings

      - name: Test adapter
        run: cargo test --locked --manifest-path crates/tables-wasm/Cargo.toml

      - name: Check adapter documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path crates/tables-wasm/Cargo.toml --no-deps

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test TypeScript/Rust/Wasm parity
        run: bun run test:wasm-parity

      - name: Build browser Wasm
        run: bun run build:wasm

      - name: Build package with Wasm artifacts
        run: bun run build

      - name: Check packaged Wasm artifacts
        run: node ./scripts/check-wasm-package.mjs

      - name: Measure TypeScript/Wasm boundary
        run: bun run benchmark:virtualization

      - name: Upload boundary benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: virtualization-boundary-${{ github.sha }}
          path: .artifacts/virtualization-boundary-benchmark.json
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Benchmark evidence
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run descriptive benchmarks
        run: cargo bench --locked --workspace 2>&1 | tee rust-benchmarks.txt

      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-benchmarks-${{ github.sha }}
          path: rust-benchmarks.txt
          if-no-files-found: error
          retention-days: 14
