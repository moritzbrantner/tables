name: Rust Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/rust-foundation.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/rust-foundation.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Compile benchmark targets
        run: cargo bench --locked --workspace --no-run

  benchmark:
    name: Benchmark evidence
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run descriptive benchmarks
        run: cargo bench --locked --workspace 2>&1 | tee rust-benchmarks.txt

      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-benchmarks-${{ github.sha }}
          path: rust-benchmarks.txt
          if-no-files-found: error
          retention-days: 14
