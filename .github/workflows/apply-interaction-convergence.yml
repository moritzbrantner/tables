name: Apply interaction convergence source patch

on:
  push:
    branches: [feat/table-interaction-convergence]
    paths:
      - "scripts/apply-interaction-convergence.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/table-interaction-convergence
      - name: Apply exact source patch
        run: node scripts/apply-interaction-convergence.mjs
      - name: Verify patch shape
        run: git diff --check && git diff --stat
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react.tsx src/data.ts
          git commit -m "Wire localized table interaction boundaries"
          git push origin HEAD:feat/table-interaction-convergence
