name: Apply React import cleanup

on:
  push:
    branches: [feat/table-interaction-convergence]
    paths:
      - "scripts/apply-react-cleanup.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/table-interaction-convergence
      - run: node scripts/apply-react-cleanup.mjs
      - run: git diff --check && git diff -- src/react.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react.tsx
          git commit -m "Clean extracted menu imports"
          git push origin HEAD:feat/table-interaction-convergence
