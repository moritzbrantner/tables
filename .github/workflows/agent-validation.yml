name: Temporary tables validation
on:
  push:
    branches: [agent/tables-window-validation]
permissions:
  contents: write
concurrency:
  group: tables-window-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply reviewed local change to guarded work branch
        run: |
          cp agent-change.patch.gz /tmp/change.gz
          git checkout perf/windowed-reference-parity
          test "$(git rev-parse HEAD)" = 7cfec05fb37ab1e7b6b0bd3c8e05907005d3a7b6
          gzip -dc /tmp/change.gz > /tmp/change.patch
          ! grep -q '^diff --git a/.github/' /tmp/change.patch
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.test.ts')
          p.write_text(p.read_text().replace('  "createTableModel",', '  "createTableModel",\n  "createTableWindowModel",'))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install validation dependencies
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          bun install --frozen-lockfile
          npm install --prefix benchmarks/browser --ignore-scripts --no-audit --no-fund
          npm install --prefix benchmarks/references --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi
      - name: Format and validate query changes
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace -- --show-output
          bun run check-types
          bun run test
          bun run build:wasm
          bun run test:wasm-parity
          bun run benchmark:virtualization
      - name: Commit validated query foundation
        run: |
          git config user.name 'moritzbrantner'
          git config user.email '31051084+moritzbrantner@users.noreply.github.com'
          git add crates src benchmarks
          git diff --cached --check
          git commit -m 'perf(query): bound sorted windows and expose windowed models'
          git push origin HEAD:refs/heads/perf/windowed-reference-parity
      - name: Retain Wasm validation inputs
        if: always()
        run: |
          mkdir -p .artifacts/wasm-inputs
          git archive --format=tar HEAD > .artifacts/wasm-inputs/source.tar
          git rev-parse HEAD > .artifacts/wasm-inputs/source-sha.txt
          cp -a "$HOME/.cargo/registry" .artifacts/wasm-inputs/registry
          cp -a "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/lib/rustlib/wasm32-unknown-unknown" .artifacts/wasm-inputs/wasm32-unknown-unknown || true
          find "$HOME" -type f -name wasm-bindgen -executable -exec cp '{}' .artifacts/wasm-inputs/wasm-bindgen \; || true
          tar -czf /tmp/tables-wasm-inputs.tar.gz .artifacts/wasm-inputs .artifacts/tables-wasm-node .artifacts/tables-wasm-node-release .artifacts/virtualization-boundary-benchmark.json src/wasm/generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tables-wasm-inputs
          path: /tmp/tables-wasm-inputs.tar.gz
          retention-days: 1
          compression-level: 0
