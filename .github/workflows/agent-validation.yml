name: Temporary tables validation
on:
  push:
    branches: [agent/tables-window-validation]
permissions:
  contents: write
concurrency:
  group: tables-window-validation
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply locally validated browser integration
        run: |
          cp completion.patch /tmp/completion.patch
          git checkout perf/windowed-reference-parity
          test "$(git rev-parse HEAD)" = 7977d963a9aab2b4df0304646dce869989038696
          sed -i 's/^ diff --git/diff --git/' /tmp/completion.patch
          git apply --check /tmp/completion.patch
          git apply /tmp/completion.patch
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/deploy-pages.yml': '1f7a9ce2526e087efe76deca3ffa8542128b61d6',
              '.github/workflows/rust.yml': '795183e65930fe77fe00a92ae45d30950008503d',
              'benchmarks/browser/adapters.tsx': 'eb21c3731785311a587feb81dd65a147fdb7fa7b',
              'benchmarks/browser/contract.mjs': '8550f5de73cdfb3d58cd00aec52b8c1c6e37b378',
              'benchmarks/browser/contract.test.mjs': '2579ef40a912a7b5c59589a67f8eb220db331543',
              'benchmarks/browser/run.mjs': '665097672638abbfb6e8c1234d98c13334c0dc08',
              'examples/src/windowed-main.tsx': '2784210bf367231c95589b426974673e168fdf8e',
              'scripts/smoke-pages.mjs': '1592fad619a4efe2d56167d97c843f7a9f15d6a8',
              'tests/e2e/windowed.spec.ts': '50a51c8b4912cacb52bc6e93e7197f2023cd814c',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          PY
          node --test benchmarks/browser/contract.test.mjs
          git config user.name 'moritzbrantner'
          git config user.email '31051084+moritzbrantner@users.noreply.github.com'
          git add .github/workflows/deploy-pages.yml .github/workflows/rust.yml benchmarks/browser examples/src/windowed-main.tsx scripts/smoke-pages.mjs tests/e2e/windowed.spec.ts
          git diff --cached --check
          git commit -m 'test(browser): integrate strict reference evidence and production Pages checks'
          git push origin HEAD:refs/heads/perf/windowed-reference-parity
