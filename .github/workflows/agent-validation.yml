name: Temporary tables validation
on:
  push:
    branches: [agent/tables-window-validation]
permissions:
  contents: write
concurrency:
  group: tables-window-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Apply validated continuation to guarded work branch
        run: |
          cp remaining.patch /tmp/remaining.patch
          git checkout perf/windowed-reference-parity
          test "$(git rev-parse HEAD)" = 8af38ac4dc0bfff708c3408314a52d4e5592a2e6
          ! grep -q '^diff --git a/.github/' /tmp/remaining.patch
          git apply --check /tmp/remaining.patch
          git apply /tmp/remaining.patch
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install validation dependencies
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          bun install --frozen-lockfile
          npm ci --prefix benchmarks/browser --ignore-scripts --no-audit --no-fund
          if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi
          bunx playwright install --with-deps chromium
      - name: Validate query and browser sources
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace -- --show-output
          bun run check-types
          bun run test
          bun run build:wasm
          bun run test:wasm-parity
          bun run build:references
          bun run build:examples:pages
      - name: Commit validated continuation
        run: |
          git config user.name 'moritzbrantner'
          git config user.email '31051084+moritzbrantner@users.noreply.github.com'
          git add .gitignore crates src benchmarks docs examples scripts tests package.json vite.config.ts
          git diff --cached --check
          git commit -m 'test(performance): integrate windowed queries and production reference coverage'
          git push origin HEAD:refs/heads/perf/windowed-reference-parity
      - name: Exercise production examples
        run: |
          mkdir -p dist-examples/benchmarks
          bun run benchmark:query -- --output dist-examples/benchmarks/query.json
          node scripts/smoke-pages.mjs
          bun run test:e2e -- tests/e2e/windowed.spec.ts
      - name: Measure actual browser reference matrix
        if: success() || failure()
        run: node benchmarks/browser/run.mjs
      - name: Measure public query windows
        if: success() || failure()
        run: |
          bun run benchmark:virtualization
          bun run benchmark:windows
      - name: Retain evidence and source
        if: always()
        run: |
          mkdir -p .artifacts
          git archive --format=tar HEAD > .artifacts/source.tar
          git diff HEAD > .artifacts/uncommitted.patch
          git rev-parse HEAD > .artifacts/source-sha.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tables-continuation-evidence
          path: |
            .artifacts/*.json
            .artifacts/*.png
            .artifacts/source.tar
            .artifacts/uncommitted.patch
            .artifacts/source-sha.txt
            test-results
          retention-days: 7
