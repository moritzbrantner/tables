name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check package
        run: bunx publint --pack bun --strict

      - name: Build examples
        run: bun run build:examples
