name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx oxlint@1.80.0 --format=github

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Build Wasm
        run: bun run build:wasm

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Test Wasm parity
        run: bun run test:wasm-parity

      - name: Build
        run: bun run build

      - name: Check package
        run: bun run pack:check

      - name: Build examples
        run: bun run build:examples
