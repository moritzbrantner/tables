name: Apply server window offset repair

on:
  push:
    branches: [feat/server-table-convergence]
    paths:
      - "scripts/apply-server-window-offset.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/server-table-convergence
      - name: Apply exact source patch
        run: node scripts/apply-server-window-offset.mjs
      - name: Verify patch shape
        run: git diff --check && git diff -- src/react.tsx
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react.tsx
          git commit -m "Apply server window row offsets"
          git push origin HEAD:feat/server-table-convergence
