name: Verify Pages view-state dogfood

on:
  push:
    branches:
      - feat/table-view-state-codec

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/table-view-state-codec
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply refinement
        run: python scripts/refine-view-state.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify package and Pages
        run: |
          bun run check:pages
          bun run build
          bunx publint --pack bun --strict
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify browser view-state behavior
        run: bun run test:e2e
      - name: Commit refinement
        run: |
          rm -f scripts/refine-view-state.py .github/workflows/refine-view-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Dogfood durable view state on Pages"
          git push origin HEAD:feat/table-view-state-codec
