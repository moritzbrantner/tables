name: Verify view-state review repairs

on:
  push:
    branches:
      - feat/table-view-state-codec

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/table-view-state-codec
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply review repairs
        run: python scripts/address-view-state-review.py
      - name: Verify package and source aliases
        run: |
          bun install --frozen-lockfile
          bun run check:pages
          bun run build
          bunx publint --pack bun --strict
      - name: Commit verified review repairs
        run: |
          rm -f scripts/address-view-state-review.py .github/workflows/address-view-state-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address durable view-state review"
          git push origin HEAD:feat/table-view-state-codec
