name: Apply browser acceptance fixes

on:
  push:
    branches: [feat/table-interaction-convergence]
    paths:
      - "scripts/apply-browser-acceptance-fixes.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/table-interaction-convergence
      - run: node scripts/apply-browser-acceptance-fixes.mjs
      - run: git diff --check && git diff --stat
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react.tsx src/react.messages.test.tsx examples/src/styles.css tests/e2e/localization-theme.spec.ts
          git commit -m "Fix grid naming and narrow acceptance"
          git push origin HEAD:feat/table-interaction-convergence
