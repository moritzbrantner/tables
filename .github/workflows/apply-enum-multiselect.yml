name: Apply enum multi-select filter patch

on:
  push:
    branches:
      - fix/enum-multiselect-filters

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/enum-multiselect-filters
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply patch
        run: python3 scripts/apply-enum-multiselect-patch.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Run focused tests
        run: bunx vitest run src/react.typed-filter.test.tsx

      - name: Commit patch
        shell: bash
        run: |
          rm scripts/apply-enum-multiselect-patch.py
          rm .github/workflows/apply-enum-multiselect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react.tsx src/react.typed-filter.test.tsx scripts/apply-enum-multiselect-patch.py .github/workflows/apply-enum-multiselect.yml
          git commit -m "fix: use multi-select enum filters"
          git push origin HEAD:fix/enum-multiselect-filters
